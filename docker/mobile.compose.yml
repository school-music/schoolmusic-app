services:
  api:
    ports: !override
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Features__SwaggerEnabled: "true"
      Auth__AllowLocalRegistration: "true"
      Scheduler__Enabled: "${SCHOOLMUSIC_SCHEDULER:-true}"
      Voting__AllowVotingOutsideSchedule: "${SCHOOLMUSIC_TEST_VOTING:-false}"
