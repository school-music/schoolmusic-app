services:
  db:
    container_name: !reset null
  redis:
    container_name: !reset null
  api:
    container_name: !reset null
    image: schoolmusic-mobile-api:latest
    ports: !override
      - "127.0.0.1:8082:8080"
    environment:
      Scheduler__Enabled: "false"
      Voting__AllowVotingOutsideSchedule: "true"
